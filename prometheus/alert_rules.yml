groups:
  - name: parking-netty-alerts
    rules:
      - alert: HighConnectionCount
        expr: parking_netty_connection_count > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High connection count detected
          description: Connection count is above 1000 (current: {{ $value }})

      - alert: CriticalConnectionCount
        expr: parking_netty_connection_count > 5000
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Critical connection count detected
          description: Connection count is above 5000 (current: {{ $value }})

      - alert: HighAuthFailureRate
        expr: rate(parking_netty_auth_failures_total[5m]) / rate(parking_netty_auth_attempts_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High authentication failure rate
          description: Authentication failure rate is above 10% (current: {{ $value | humanizePercentage }})

      - alert: HighMessageLatency
        expr: histogram_quantile(0.99, rate(parking_netty_message_latency_bucket[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High message latency detected
          description: P99 message latency is above 500ms (current: {{ $value | humanizeDuration }})

      - alert: CriticalMessageLatency
        expr: histogram_quantile(0.99, rate(parking_netty_message_latency_bucket[5m])) > 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Critical message latency detected
          description: P99 message latency is above 1s (current: {{ $value | humanizeDuration }})

      - alert: TargetDown
        expr: up{job="parking-netty"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Parking Netty target is down
          description: The parking-netty target has been down for more than 1 minute
