spring:
  config:
    import: auth.yml
  profiles:
    active: h2  # 默认使用 H2，可选值：h2 | mysql

server:
  port: 8080

netty:
  tcp:
    port: 8889
    # 认证超时时间（秒）
    auth-timeout: 10
    # 心跳间隔（秒）
    heartbeat-interval: 90
    #  backlog 大小
    backlog: 128

logging:
  level:
    cn.tnar.parking: DEBUG
    io.netty: INFO

scheduler:
  database:
    core-threads: 20
    max-threads: 100
    queue-capacity: 5000
    timeout-seconds: 10
  external:
    core-threads: 10
    max-threads: 50
    queue-capacity: 1000
    timeout-seconds: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: parking-netty
    distribution:
      percentiles-histogram:
        parking.netty.auth.duration: true
        parking.netty.message.duration: true
  prometheus:
    metrics:
      export:
        enabled: true
        step: 15s

auth:
  storage:
    # in-memory | redis | jdbc
    type: in-memory
    admin-token: change-me-in-production
  redis:
    host: localhost
    port: 6379
    password: ${REDIS_PASSWORD:}
    database: 0
    key-prefix: 'parking:auth:'
  jdbc:
    url: jdbc:mysql://localhost:3306/parking?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
    username: root
    password: ${DB_PASSWORD:}
    table: auth_info
