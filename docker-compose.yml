version: '3.8'

services:
  nginx-lb:
    image: nginx:alpine
    container_name: nginx-lb
    ports:
      - "8889:8889"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - netty-server-1
      - netty-server-2
    networks:
      - netty-network
    restart: unless-stopped

  netty-server-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netty-server-1
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8080
      - NETTY_TCP_PORT=8890
      - MANAGEMENT_SERVER_PORT=8081
      - SPRING_PROFILES_ACTIVE=docker
    volumes:
      - ./logs/server1:/app/logs
    networks:
      - netty-network
    restart: unless-stopped

  netty-server-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netty-server-2
    ports:
      - "8082:8081"
    environment:
      - SERVER_PORT=8080
      - NETTY_TCP_PORT=8891
      - MANAGEMENT_SERVER_PORT=8081
      - SPRING_PROFILES_ACTIVE=docker
    volumes:
      - ./logs/server2:/app/logs
    networks:
      - netty-network
    restart: unless-stopped

networks:
  netty-network:
    driver: bridge
